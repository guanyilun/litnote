<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" role="img" aria-labelledby="title desc">
  <title id="title">Combine measurements by precision</title>
  <desc id="desc">Measurement and uncertainty pairs produce weighted contributions and precisions. Sum both separately, then divide to get the estimate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40566b"/></marker>
  </defs>
  <rect width="780" height="250" fill="white"/>
  <g fill="#edf4fa" stroke="#40566b" stroke-width="1.5">
    <rect x="15" y="30" width="170" height="70" rx="8"/>
    <rect x="15" y="150" width="170" height="70" rx="8"/>
    <rect x="240" y="30" width="190" height="70" rx="8"/>
    <rect x="240" y="150" width="190" height="70" rx="8"/>
    <rect x="485" y="80" width="125" height="90" rx="8"/>
    <rect x="665" y="80" width="100" height="90" rx="8"/>
  </g>
  <g stroke="#40566b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M185 65 H235"/><path d="M185 185 H235"/>
    <path d="M430 65 H455 V105 H480"/><path d="M430 185 H455 V145 H480"/>
    <path d="M610 125 H660"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#172c3f" text-anchor="middle">
    <text x="100" y="59">Measurement x₁</text><text x="100" y="82">Uncertainty σ₁</text>
    <text x="100" y="179">Measurement x₂</text><text x="100" y="202">Uncertainty σ₂</text>
    <text x="335" y="59">Precision w₁ = 1/σ₁²</text><text x="335" y="82">Contribution w₁x₁</text>
    <text x="335" y="179">Precision w₂ = 1/σ₂²</text><text x="335" y="202">Contribution w₂x₂</text>
    <text x="547" y="108">Sum each:</text><text x="547" y="132">Σ wx</text><text x="547" y="155">Σ w</text>
    <text x="715" y="118">Estimate</text><text x="715" y="144">Σ wx / Σ w</text>
  </g>
</svg>
